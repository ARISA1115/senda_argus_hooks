services:
  senda-agent-studio:
    build: .
    container_name: senda-agent-studio
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - studio-data:/data
    networks:
      - senda-agent-net
volumes:
  studio-data:
networks:
  senda-agent-net:
    name: senda-agent-net
