<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Senda Agent Studio</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#dbe5f0;background:#0a0f16}*{box-sizing:border-box}body{margin:0}.top{padding:20px 24px;border-bottom:1px solid #243040;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:700}.sub{color:#8fa2b7;font-size:13px}.wrap{padding:20px 24px;display:grid;gap:18px}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.card{background:#111923;border:1px solid #243040;border-radius:12px;padding:16px}.card h2{font-size:15px;margin:0 0 12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #35506d;background:#172536;color:#dbe5f0;border-radius:8px;padding:8px 12px;cursor:pointer}button.primary{background:#2368a2}button.danger{background:#52252a}.agent{border-top:1px solid #243040;padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:10px}.agent:first-of-type{border-top:0}.status{font-size:12px;padding:3px 7px;border-radius:999px;background:#26323f}.running{color:#83e0a2}.stopped{color:#e4a0a0}.muted{color:#8fa2b7;font-size:12px}.events{max-height:460px;overflow:auto}.event{padding:9px 0;border-top:1px solid #243040;font-size:13px}.event:first-child{border-top:0}.etype{font-family:ui-monospace,monospace}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:12px;color:#8fa2b7}.form input,.form select,.form textarea{width:100%;margin-top:4px;background:#0c131b;color:#e8f0f8;border:1px solid #304052;border-radius:7px;padding:9px}.full{grid-column:1/-1}.trace-row{display:grid;grid-template-columns:155px 220px 1fr;gap:10px;padding:8px 0;border-top:1px solid #243040;font-size:12px}.err{color:#ff9d9d}@media(max-width:900px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.trace-row{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body>
<div class="top"><div><div class="brand">Senda Agent Studio</div><div class="sub">Managed Agent Runtime / Hook Observability</div></div><div id="health" class="sub">connecting...</div></div>
<div class="wrap">
<div class="grid"><section class="card"><h2>Agents</h2><div class="toolbar"><button id="refresh">Refresh</button></div><div id="agents"></div></section>
<section class="card"><h2>Create Agent</h2><form id="create" class="form"><label>Name<input name="name" required placeholder="soc-agent"></label><label>Runtime<select name="runtime"><option>python</option><option>node</option></select></label><label class="full">Image<input name="image" required placeholder="senda/python-agent:0.8"></label><label class="full">Command<input name="command" placeholder="python /app/agent.py"></label><label>Project<input name="project" value="default"></label><label>Environment<input name="environment" value="prod"></label><label class="full">Studio endpoint<input name="studio_endpoint" value="http://senda-agent-studio:8080"></label><label class="full">Environment JSON<textarea name="env" rows="3" placeholder='{"OPENAI_API_KEY":"..."}'></textarea></label><div class="full"><button class="primary" type="submit">Deploy Agent</button> <span id="createMsg" class="muted"></span></div></form></section></div>
<section class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2>Live Hook Events</h2><span id="liveState" class="muted">connecting</span></div><div id="events" class="events"></div></section>
<section class="card"><h2>Agent Trace</h2><div class="toolbar"><input id="traceAgent" placeholder="agent_id" style="background:#0c131b;color:#e8f0f8;border:1px solid #304052;border-radius:7px;padding:8px"><button id="loadTrace">Find traces</button></div><div id="traceGroups" class="toolbar" style="margin:10px 0"></div><div id="trace"></div></section>
</div><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt}); if(!r.ok) throw Error(await r.text()); return r.json()}
async function health(){try{await api('/api/health'); $('#health').textContent='Studio online'}catch{$('#health').textContent='Studio offline'}}
async function loadAgents(){try{const d=await api('/api/agents'); $('#agents').innerHTML=d.agents.length?d.agents.map(a=>`<div class="agent"><div><b>${esc(a.name)}</b> <span class="status ${a.running?'running':'stopped'}">${esc(a.status)}</span><div class="muted">${esc(a.runtime)} · ${esc(a.image)} · agent_id=${esc(a.agent_id)}</div></div><div class="toolbar"><button data-action="start" data-id="${esc(a.container_id)}">Start</button><button data-action="stop" data-id="${esc(a.container_id)}">Stop</button><button data-action="restart" data-id="${esc(a.container_id)}">Restart</button><button data-trace="${esc(a.agent_id)}">Trace</button></div></div>`).join(''):'<div class="muted">No managed agents.</div>'}catch(e){$('#agents').innerHTML=`<div class="err">${esc(e.message)}</div>`}}
$('#agents').addEventListener('click',async e=>{const b=e.target.closest('button'); if(!b)return;if(b.dataset.trace){$('#traceAgent').value=b.dataset.trace;loadTrace();return} if(b.dataset.action){b.disabled=true;try{await api(`/api/agents/${encodeURIComponent(b.dataset.id)}/${b.dataset.action}`,{method:'POST'});setTimeout(loadAgents,400)}catch(x){alert(x.message)}finally{b.disabled=false}}});
$('#refresh').onclick=loadAgents;
$('#create').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);let env={};try{env=fd.get('env')?JSON.parse(fd.get('env')):{}}catch{$('#createMsg').textContent='Environment JSON is invalid';return} const body=Object.fromEntries(fd.entries());body.env=env;if(!body.command)delete body.command;$('#createMsg').textContent='deploying...';try{await api('/api/agents',{method:'POST',body:JSON.stringify(body)});$('#createMsg').textContent='deployed';loadAgents()}catch(x){$('#createMsg').textContent=x.message}};
function addEvent(ev){const box=$('#events');const div=document.createElement('div');div.className='event';div.innerHTML=`<span class="etype">${esc(ev.event_type)}</span> <span class="muted">${esc(ev.agent_id||'-')} · ${esc(ev.timestamp||'')}</span>${ev.status?` · ${esc(ev.status)}`:''}`;box.prepend(div);while(box.children.length>150)box.lastChild.remove()}
async function initialEvents(){try{const d=await api('/api/events?limit=80');d.events.reverse().forEach(addEvent)}catch{}}
function live(){const es=new EventSource('/api/events/stream');es.addEventListener('ready',()=>$('#liveState').textContent='live');es.addEventListener('hook',e=>addEvent(JSON.parse(e.data)));es.onerror=()=>$('#liveState').textContent='reconnecting...'}
async function showTrace(q){try{const d=await api('/api/traces?'+q+'&limit=500');$('#trace').innerHTML=d.events.length?d.events.map(ev=>`<div class="trace-row"><div>${esc(ev.timestamp||'')}</div><div class="etype">${esc(ev.event_type)}</div><div>${esc(ev.status||'')} <span class="muted">trace=${esc(ev.trace_id||'-')} run=${esc(ev.run_id||'-')}</span></div></div>`).join(''):'<div class="muted">No trace events.</div>'}catch(e){$('#trace').innerHTML=`<div class="err">${esc(e.message)}</div>`}}
async function loadTrace(){const id=$('#traceAgent').value.trim();if(!id)return;try{const d=await api('/api/agents/'+encodeURIComponent(id)+'/trace-groups?limit=20');$('#traceGroups').innerHTML=d.traces.length?d.traces.map((t,i)=>`<button data-traceid="${esc(t.trace_id||'')}" data-runid="${esc(t.run_id||'')}">${i+1}. ${esc(t.event_count)} events · ${esc(t.last_timestamp||'')}</button>`).join(''):'<span class="muted">No traces.</span>';if(d.traces[0]){const t=d.traces[0];showTrace(t.trace_id?'trace_id='+encodeURIComponent(t.trace_id):'run_id='+encodeURIComponent(t.run_id))}}catch(e){$('#trace').innerHTML=`<div class="err">${esc(e.message)}</div>`}}
$('#traceGroups').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;showTrace(b.dataset.traceid?'trace_id='+encodeURIComponent(b.dataset.traceid):'run_id='+encodeURIComponent(b.dataset.runid))});
$('#loadTrace').onclick=loadTrace;health();loadAgents();initialEvents();live();setInterval(loadAgents,10000);
</script></body></html>
